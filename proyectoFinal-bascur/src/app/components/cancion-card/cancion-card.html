<div class="tarjeta-cancion">

  <img [src]="cancion.imagen" [alt]="cancion.album">

  <div class="contenido-tarjeta">

    <h2>{{ cancion.titulo }}</h2>
    <p>Álbum: {{ cancion.album }}</p>

    <div class="botones">
      <a [href]="cancion.youtube" target="_blank">YouTube</a>
      <a [href]="cancion.spotify" target="_blank">Spotify</a>
    </div>

    <button (click)="marcarFavorita()">
      ⭐ Marcar como favorita
    </button>

  </div>
</div>
