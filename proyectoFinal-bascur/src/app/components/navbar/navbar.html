
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">

    <a class="navbar-brand" routerLink="/">
      SODA STEREO
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Abrir menú">

      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link" routerLink="/"
             routerLinkActive="pagina-activa"
             [routerLinkActiveOptions]="{ exact: true }">
            Inicio
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/nosotros"
             routerLinkActive="pagina-activa">
            Nosotros
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/contacto"
             routerLinkActive="pagina-activa">
            Contacto
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" routerLink="/cancion"
             routerLinkActive="pagina-activa">
            Canciones
          </a>
        </li>

      </ul>

      <!-- BUSCADOR -->
      <form class="d-flex buscador-soda"
            role="search"
            (submit)="$event.preventDefault(); buscar()">

        <div class="buscador-contenedor">

          <input
            class="form-control me-2"
            type="search"
            placeholder="Buscar en Soda Stereo..."
            aria-label="Buscar"
            [(ngModel)]="busqueda"
            name="busqueda"
            (input)="actualizarResultados()"
            (focus)="actualizarResultados()"
            (blur)="cerrarOpciones()">

          @if (mostrarOpciones) {
            <div class="lista-opciones">

              @for (resultado of resultadosFiltrados; track resultado.titulo + resultado.categoria) {
                <button
                  type="button"
                  class="opcion-busqueda"
                  (click)="seleccionarResultado(resultado)">

                  <span>{{ resultado.titulo }}</span>
                  <small>{{ resultado.categoria }}</small>

                </button>
              }

              @if (resultadosFiltrados.length === 0 && busqueda.trim() !== '') {
                <p class="error-busqueda">
                  No se encontraron resultados.
                </p>
              }

            </div>
          }

        </div>

        <button class="btn btn-outline-success" type="submit">
          Buscar
        </button>

      </form>

    </div>
  </div>
</nav>
