<section class="contacto">

  <div class="encabezado-contacto">
    <p class="subtitulo">ESTAMOS EN CONTACTO</p>
    <h1>CONTACTO</h1>
    <p>
      ¿Tenés alguna consulta, sugerencia o querés compartir
      algo sobre Soda Stereo? Escribinos.
    </p>
  </div>

  <div class="formulario-contacto">

    <form (submit)="$event.preventDefault(); enviarMensaje()">

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="nombre"
          placeholder="Ingresá tu nombre">
      </div>

      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="ejemplo@gmail.com">
      </div>

      <div class="campo">
        <label for="mensaje">Mensaje</label>
        <textarea
          id="mensaje"
          name="mensaje"
          [(ngModel)]="mensaje"
          rows="5"
          placeholder="Escribí tu mensaje...">
        </textarea>
      </div>

      <button type="submit">Enviar mensaje</button>

    </form>

  </div>

</section>
